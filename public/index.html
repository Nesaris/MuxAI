<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MuxAI</title>
<meta name="description" content="MuxAI — une interface auto-hébergée pour parler à tes agents IA : Claude Code, Codex, Ollama et API compatibles OpenAI.">
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Cstyle%3Epath%7Bfill%3A%23111113%3Bstroke%3A%23111113%7D%40media%20(prefers-color-scheme%3A%20dark)%7Bpath%7Bfill%3A%23fff%3Bstroke%3A%23fff%7D%7D%3C%2Fstyle%3E%3Cpath%20stroke-width%3D%221.12%22%20stroke-linejoin%3D%22round%22%20d%3D%22M2.06%205.4L8.75%205.4L16%2017.67L23.25%205.4L29.94%205.4L25.76%2026.6L19.62%2026.6L22.27%2013.2L16%2023.81L9.73%2013.2L12.38%2026.6L6.24%2026.6Z%22%2F%3E%3C%2Fsvg%3E%0A">
<style>
:root{--side:#0d0d0d;--main:#000;--pill:#212121;--hover:#1c1c1c;--on:#242424;--line:#262626;--text:#ececec;--muted:#9b9b9b;--blue:#7ab7ff;--ok:#3ecf8e;--bad:#ff7b72;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
*{box-sizing:border-box}
html,body,#root{height:100%;margin:0}
body{background:var(--main);color:var(--text);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid #fff;outline-offset:2px}
a{color:var(--blue)}
svg{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:#777}
#app{height:100%;display:grid;grid-template-columns:300px minmax(0,1fr)}
#app.closed{grid-template-columns:minmax(0,1fr)}
#app.closed aside{display:none}

aside{background:var(--side);border-right:1px solid #161616;display:flex;flex-direction:column;min-height:0}
.top{display:flex;align-items:center;gap:4px;padding:14px 10px 10px 14px}
.brandbox{flex:1;display:flex;align-items:center;min-width:0}
svg.brand{width:auto;height:20px;fill:currentColor;stroke:none;stroke-width:0}
.auth .brandbox{margin-bottom:30px}.auth svg.brand{height:26px}
.ib{display:grid;place-items:center;width:36px;height:36px;border-radius:8px;color:#cfcfcf;flex:none}
.ib:hover{background:var(--hover)}
.ib.armed{color:var(--bad);background:var(--hover)}
.ib.sm{width:28px;height:28px}.ib.sm svg{width:16px;height:16px}
nav{padding:0 6px;display:grid;gap:2px}
.item{display:flex;align-items:center;gap:12px;width:100%;height:40px;padding:0 10px;border-radius:10px;text-align:left}
.item:hover{background:var(--hover)}
.item.on{background:var(--on)}
.find{margin:0 6px 6px;display:flex}
.find input{flex:1;min-width:0;height:36px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:#141414;outline:0}
.find input:focus{border-color:#555}
.scroll{flex:1;overflow:auto;padding:0 6px 8px}
.sect{display:flex;align-items:center;justify-content:space-between;padding:22px 4px 8px 10px;color:var(--muted);font-size:14px;min-height:58px}
.r{display:flex;align-items:center;gap:2px;border-radius:10px;padding-right:4px}
.r:hover{background:var(--hover)}.r.on{background:var(--on)}
.r>.t{flex:1;min-width:0;display:flex;align-items:center;gap:10px;height:38px;padding:0 0 0 10px;text-align:left}
.r>.t span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r>input{flex:1;min-width:0;height:30px;margin:4px 0 4px 6px;padding:0 6px;border:1px solid #555;border-radius:6px;background:#141414;outline:0}
.r .ib{display:none}.r:hover .ib,.r .ib.armed,.r .ib:focus-visible{display:grid}
.r .run{width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:8px;flex:none}
.note{padding:4px 10px 0;color:var(--muted);font-size:13px}
.foot{display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid #161616}
.av{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:#2f9e63;font-size:11px;font-weight:600;text-transform:uppercase;flex:none}
.foot .n{flex:1;min-width:0;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.foot .n small{display:block;color:var(--muted);font-size:12px}

main{display:flex;flex-direction:column;min-width:0;min-height:0;position:relative}
.bar{display:flex;align-items:center;gap:8px;height:56px;padding:0 14px;flex:none}
.bar .model{display:flex;align-items:center;gap:8px;height:36px;padding:0 10px;border-radius:8px;font-size:17px;font-weight:500;min-width:0}
.bar .model span:nth-child(2){overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .model:hover{background:var(--hover)}
.bar h1{font-size:17px;font-weight:500;margin:0 0 0 6px}
.bar .sp{flex:1}
.bar select{height:32px;max-width:180px;padding:0 8px;border:1px solid var(--line);border-radius:8px;background:#0d0d0d}
.chev{width:16px;height:16px;color:#8e8e8e}
.tag{display:flex;align-items:center;gap:6px;height:28px;padding:0 4px 0 10px;border:1px solid var(--line);border-radius:14px;font-size:13px;color:#cfcfcf;white-space:nowrap}
.tag button{display:grid;place-items:center;width:20px;height:20px;border-radius:50%}.tag button:hover{background:var(--hover)}.tag svg{width:12px;height:12px}

.home{flex:1;display:grid;grid-template-columns:minmax(0,1fr);place-items:center;padding:0 20px 12vh;overflow:auto}
.home>div{width:min(770px,100%)}
.home h2{margin:0 0 28px;text-align:center;font-size:28px;font-weight:400;letter-spacing:-.01em}
.home p{text-align:center;color:var(--muted);margin:-16px 0 24px}
.home .cta{display:flex;justify-content:center}
.pill{display:flex;align-items:flex-end;gap:6px;background:var(--pill);border-radius:28px;padding:8px 8px 8px 10px}
.pill textarea{flex:1;min-width:0;height:36px;max-height:200px;padding:6px 4px;border:0;background:none;outline:0;resize:none;font-size:16px}
.pill textarea::placeholder{color:#8e8e8e}
.rb{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;flex:none}
.rb:hover{background:#2f2f2f}
.agent{display:flex;align-items:center;gap:7px;height:36px;padding:0 12px;border-radius:18px;color:#cfcfcf;white-space:nowrap;max-width:45%}
.agent span:last-child{overflow:hidden;text-overflow:ellipsis}
.agent:hover{background:#2f2f2f}
.send{background:#fff;color:#000}.send:hover{background:#d9d9d9}
.send:disabled{background:#3a3a3a;color:#888;cursor:not-allowed}

.chat{flex:1;overflow:auto}
.col{width:min(770px,100%);margin:0 auto;padding:12px 20px 24px}
.u{margin:18px 0 18px auto;width:fit-content;max-width:75%;background:var(--pill);border-radius:20px;padding:10px 16px;white-space:pre-wrap;overflow-wrap:anywhere}
.a{margin:18px 0}
.a .who{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;margin-bottom:6px}
.a .acts{display:flex;gap:2px;margin:4px 0 0 -6px}
.tools{margin:0 0 10px;color:var(--muted);font-size:13px}
.tools summary{cursor:pointer;width:fit-content;max-width:100%;border:1px solid var(--line);border-radius:10px;padding:5px 10px;list-style:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tools summary::-webkit-details-marker{display:none}
.tools ol{margin:6px 0 0;padding:8px 10px 8px 30px;border:1px solid var(--line);border-radius:10px;max-height:220px;overflow:auto;font:12px/1.5 var(--mono)}
.tools li{overflow-wrap:anywhere}.tools li b{color:var(--text);font-weight:500}
.status{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;margin-top:8px}
.status i{width:8px;height:8px;border-radius:50%;background:#fff;animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
.err{margin-top:8px;padding:8px 12px;border:1px solid var(--bad);border-radius:10px;color:var(--bad);font-size:14px;overflow-wrap:anywhere}
.md{overflow-wrap:anywhere}
.md>:first-child{margin-top:0}.md>:last-child{margin-bottom:0}
.md p,.md ul,.md ol,.md blockquote,.md pre,.md .tbl{margin:0 0 12px}
.md h2,.md h3,.md h4,.md h5{margin:22px 0 8px;line-height:1.25;font-weight:600}
.md h2{font-size:22px}.md h3{font-size:18px}.md h4,.md h5{font-size:15px}
.md ul,.md ol{padding-left:22px}.md li{margin:3px 0}
.md code{font-family:var(--mono);font-size:.88em;background:#1a1a1a;border-radius:5px;padding:1px 5px}
.md pre{position:relative;background:#0f0f0f;border:1px solid var(--line);border-radius:12px;padding:32px 14px 12px;overflow:auto}
.md pre code{background:none;padding:0;font-size:13px;line-height:1.5;white-space:pre}
.md pre .lang{position:absolute;top:8px;left:14px;font:11px var(--mono);color:var(--muted)}
.md pre .copy{position:absolute;top:5px;right:6px;height:22px;padding:0 8px;border-radius:6px;color:var(--muted);font-size:12px}
.md pre .copy:hover{background:#262626;color:var(--text)}
.md blockquote{border-left:3px solid var(--line);padding-left:12px;color:var(--muted)}
.md hr{border:0;border-top:1px solid var(--line);margin:18px 0}
.md .tbl{overflow:auto}.md table{border-collapse:collapse;font-size:14px}
.md th,.md td{border:1px solid var(--line);padding:5px 10px;text-align:left;vertical-align:top}.md th{background:#141414}
.pill{position:relative}
.slash{position:absolute;left:0;right:0;top:calc(100% + 8px);z-index:4;display:none;max-height:300px;overflow:auto;background:#1f1f1f;border:1px solid #303030;border-radius:14px;padding:6px;box-shadow:0 12px 32px rgba(0,0,0,.6)}
.slash.show{display:block}
.pill.up .slash{top:auto;bottom:calc(100% + 8px)}
.slash button{display:flex;align-items:baseline;gap:12px;width:100%;min-height:38px;padding:6px 10px;border-radius:10px;text-align:left}
.slash button.on,.slash button:hover{background:#2e2e2e}
.slash code{font:14px var(--mono);white-space:nowrap}
.slash span{flex:1;min-width:0;color:var(--muted);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slash small{color:var(--muted);font-size:12px;white-space:nowrap}
.dock{padding:0 20px 14px;flex:none}
.dock>div{width:min(770px,100%);margin:0 auto}
.hint{text-align:center;color:var(--muted);font-size:12px;margin-top:8px}

/* Menus en cascade */
.menu,.fly{background:#1f1f1f;border:1px solid #303030;border-radius:14px;padding:6px;box-shadow:0 12px 32px rgba(0,0,0,.6)}
.menu{position:absolute;display:none;width:270px;z-index:5}
.menu.show{display:block}
.menu .item{height:44px}.menu .item small{display:block;color:var(--muted);font-size:12px;line-height:1.1}
.menu .item>span:not(.dot):not(.ondot){min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.menu .item:hover,.mi:hover>.item,.mi.open>.item{background:#2e2e2e}
.mi{position:relative}
.fly{display:none;position:absolute;left:calc(100% - 2px);top:-7px;width:230px;z-index:6}
.fly .item{height:38px}
.fly.leaf{max-height:60vh;overflow:auto}
.mi:hover>.fly,.mi.open>.fly{display:block}
.menu.left .fly{left:auto;right:calc(100% - 2px)}
.menu.up .fly{top:auto;bottom:-7px}
.menu .chev,.menu .check{margin-left:auto}.menu .check{width:16px;height:16px}
.menu .ondot{width:6px;height:6px;border-radius:50%;background:#fff;margin-left:auto;flex:none}.menu .ondot+span .chev{margin-left:0}
#ctx{position:fixed;z-index:30;width:250px}
.menu .item.danger{color:var(--bad)}
.r.arch>.t{color:var(--muted)}
.menu hr{border:0;border-top:1px solid #303030;margin:6px 4px}
.menu .wait{padding:10px 12px;color:var(--muted);font-size:13px}
.menu .filter{width:100%;height:32px;margin:0 0 4px;padding:0 10px;border:1px solid #333;border-radius:8px;background:#171717;outline:0;font-size:13px}

/* Pages et formulaires */
.page{flex:1;overflow:auto}
.page .col{padding-top:20px;padding-bottom:60px}
.ph{display:flex;align-items:center;gap:12px;margin-bottom:6px}.ph h2{flex:1;margin:0;font-size:24px;font-weight:500;letter-spacing:-.01em}
.page .col>p{margin:0 0 18px;color:var(--muted);font-size:14px;max-width:64ch}
.page h3{font-size:16px;font-weight:600;margin:30px 0 8px}
.ph+h3{margin-top:18px}.page h3+.cards{margin-top:10px}
.btn{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 16px;border:1px solid #333;border-radius:18px;font-size:14px;white-space:nowrap;flex:none}
.btn:hover{background:var(--hover)}
.btn.go{background:#fff;color:#000;border-color:#fff}.btn.go:hover{background:#d9d9d9}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn svg{width:16px;height:16px}
.row{display:flex;align-items:center;gap:12px;padding:12px 2px;border-top:1px solid var(--line)}
.row .n{flex:1;min-width:0}.row .n div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.row .n small{display:block;color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .st{font-size:13px;color:var(--muted);white-space:nowrap}.row .st.ok{color:var(--ok)}.row .st.ko{color:var(--bad)}
.ghrepos{display:grid;gap:9px;padding:0 0 4px 36px}.ghrepos:not(:empty){padding-bottom:14px}.ghrepos label.check,.row label.check{display:flex;align-items:center;gap:9px;font-size:14px;cursor:pointer}.ghrepos small,.row .n small{color:var(--muted)}
.none{padding:22px;border:1px dashed #333;border-radius:14px;color:var(--muted);font-size:14px}
.form{display:grid;gap:16px;max-width:620px}
.form label{display:grid;gap:6px;font-size:13px;font-weight:600}
.form label.check{display:flex;align-items:center;gap:9px;font-weight:400;font-size:14px}
.form small{font-weight:400;color:var(--muted);font-size:12.5px;line-height:1.45}
.form input:not([type=checkbox]),.form select,.form textarea{width:100%;height:40px;padding:0 12px;border:1px solid #333;border-radius:10px;background:#111;font-weight:400;outline:0}
.form input:focus,.form select:focus,.form textarea:focus{border-color:#777}
.form textarea{height:auto;min-height:72px;padding:10px 12px;resize:vertical;line-height:1.5}
.form textarea.code{font:13px/1.5 var(--mono)}
.form input[type=checkbox]{width:16px;height:16px;accent-color:#fff;flex:none}
.form fieldset{border:0;padding:0;margin:0;display:grid;gap:8px}.form legend{font-size:13px;font-weight:600;padding:0;margin-bottom:6px}
.form .actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.form .ferr{color:var(--bad);font-size:13px;min-height:1em}
.okmsg{color:var(--ok);font-size:13px}
.cmd{background:#0f0f0f;border:1px solid var(--line);border-radius:12px;padding:14px;font:13px/1.5 var(--mono);overflow-wrap:anywhere;white-space:pre-wrap;margin:10px 0 14px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:10px;margin-top:6px}
.card{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:16px;border:1px solid var(--line);border-radius:16px;text-align:left;background:#0c0c0c;min-height:132px}
.card:hover{background:var(--hover);border-color:#3a3a3a}
.card b{font-weight:600}.card small{display:block;color:var(--muted);font-size:13px;line-height:1.35;margin-top:2px}
.logo{display:grid;place-items:center;width:40px;height:40px;border-radius:10px;background:#fff;overflow:hidden;flex:none;color:#000;font-weight:700}
.logo img{width:100%;height:100%;object-fit:contain;padding:6px}
.logo.sm{width:26px;height:26px;border-radius:7px;font-size:12px}.logo.sm img{padding:3px}
.wh{display:flex;align-items:center;gap:12px;margin-bottom:14px}.wh h2{margin:0;font-size:24px;font-weight:500}
.wstat{margin:0 0 16px;color:var(--muted);font-size:14px}.wstat.ok{color:var(--ok)}.wstat.ko{color:var(--bad)}
.steps{display:grid;gap:14px;margin:0 0 16px;padding:0;list-style:none;counter-reset:s}
.steps li{counter-increment:s;display:grid;gap:8px;padding:14px 16px;border:1px solid var(--line);border-radius:14px}
.steps li>span::before{content:counter(s) ". ";color:var(--muted)}
.steps .line{display:flex;gap:8px;flex-wrap:wrap}.steps input{flex:1;min-width:160px;height:38px;padding:0 12px;border:1px solid #333;border-radius:10px;background:#111;outline:0}
a.btn{text-decoration:none;color:inherit}a.btn.go{color:#000}a.btn[aria-disabled=true]{opacity:.45;pointer-events:none}
.out{margin:0;color:var(--muted);font-size:13px}.out pre{margin:8px 0 0;padding:12px;border:1px solid var(--line);border-radius:10px;background:#0f0f0f;font:12px/1.5 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere;max-height:220px;overflow:auto;color:#cfcfcf}
.needs{margin:0 0 16px;padding-left:20px;color:var(--muted);font-size:14px;max-width:70ch}.needs li{margin:4px 0}
code.inl{font:13px var(--mono);background:#1a1a1a;border-radius:5px;padding:2px 6px;overflow-wrap:anywhere}
.presets{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px}

.auth{min-height:100%;display:grid;place-items:center;padding:24px}
.auth>div{width:min(380px,100%)}
.auth b{display:block;font-size:22px;font-weight:600;margin-bottom:28px}
.auth h1{font-size:24px;font-weight:500;margin:0 0 4px}.auth p{color:var(--muted);margin:0 0 22px;font-size:14px}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#fff;color:#000;border-radius:10px;padding:8px 14px;font-size:14px;z-index:20;max-width:90vw}
#toast:empty{display:none}
.shade{display:none}
/* Écrans tactiles : les actions révélées au survol restent visibles, cibles plus grandes */
@media (hover:none){
  .r .ib{display:grid}
  .ib.sm{width:36px;height:36px}
  .mi:hover>.fly{display:none}.mi.open>.fly{display:block}
  .menu .item:hover,.mi:hover>.item{background:none}.mi.open>.item{background:#2e2e2e}
}
/* Tablette */
@media (max-width:1100px){
  #app{grid-template-columns:260px minmax(0,1fr)}
  .fly{width:200px}
}
/* Téléphone et petite tablette : panneau en tiroir, menus en feuille basse, lignes empilées */
@media (max-width:820px){
  #app{grid-template-columns:minmax(0,1fr);height:100dvh}
  #app aside{display:none}
  #app.closed aside{display:flex;position:fixed;inset:0 auto 0 0;width:min(320px,86vw);z-index:9;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
  #app.closed .shade{display:block;position:fixed;inset:0;z-index:8;background:rgba(0,0,0,.6)}
  .ib.sm{width:36px;height:36px}
  .bar{gap:4px;padding:0 8px;padding-top:env(safe-area-inset-top);height:calc(52px + env(safe-area-inset-top))}
  .bar .model{font-size:16px;padding:0 6px;flex:0 1 auto}
  .bar select{max-width:108px}
  .tag{min-width:0;flex:0 1 auto;overflow:hidden}.tag{max-width:38vw}
  .home{padding:0 12px 8vh}
  .home h2{font-size:24px;margin-bottom:22px}
  .col{padding:8px 14px 20px}
  .u{max-width:88%}
  .dock{padding:0 10px calc(10px + env(safe-area-inset-bottom))}
  .hint{display:none}
  .agent{max-width:38%;padding:0 8px}
  .md pre{padding:30px 12px 10px}
  /* Menus : feuille en bas de l'écran, sous-menus dépliés sur place */
  .menu{position:fixed;left:8px!important;right:8px;top:auto!important;bottom:calc(8px + env(safe-area-inset-bottom))!important;width:auto;max-height:72dvh;overflow:auto;z-index:12;border-radius:18px}
  #ctx{width:auto}
  .menu .item{height:48px}
  .fly,.menu.left .fly,.menu.up .fly{position:static;width:auto;border:0;box-shadow:none;background:none;padding:0 0 4px 22px;border-radius:0}
  .fly .item{height:44px}
  .fly.leaf{max-height:none;overflow:visible}
  .mi:hover>.fly{display:none}.mi.open>.fly{display:block}
  .mi.open>.item .chev{transform:rotate(90deg)}
  /* Pages */
  .page .col{padding-top:8px}
  .ph{flex-wrap:wrap}.ph h2{font-size:21px;flex-basis:100%}
  .row{flex-wrap:wrap;gap:8px 10px;padding:14px 0}
  .row .n{flex:1 1 calc(100% - 40px)}
  .row .st{margin-left:20px;margin-right:auto}

function onEvent(ev, id) {

async function listen(respPromise, id) {
